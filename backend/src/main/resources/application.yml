spring:
  application:
    name: backend
  data:
    web:
      pageable:
        max-page-size: 100
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 병렬 브랜치에서 먼저 적용된 더 높은 버전 뒤로 migration이 병합될 수 있다.
    out-of-order: ${FLYWAY_OUT_OF_ORDER:true}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}
  mail:
    host: ${BREVO_SMTP_HOST:smtp-relay.brevo.com}
    port: ${BREVO_SMTP_PORT:587}
    username: ${BREVO_SMTP_USERNAME:}
    password: ${BREVO_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:10000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}

server:
  forward-headers-strategy: framework

management:
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    supported-submit-methods: []

app:
  member:
    withdrawal:
      retention-days: ${MEMBER_WITHDRAWAL_RETENTION_DAYS:90}
  file-storage:
    type: ${FILE_STORAGE_TYPE:local}
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    s3:
      bucket: ${AWS_S3_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
  auth:
    admin-account:
      enabled: ${ADMIN_ACCOUNT_ENABLED:false}
      username: ${ADMIN_USERNAME:admin12}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    test-accounts:
      enabled: ${TEST_ACCOUNTS_ENABLED:true}
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
      refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
    oauth2-token:
      encryption-key: ${OAUTH_TOKEN_ENCRYPTION_KEY:}
      retention: ${OAUTH_TOKEN_RETENTION:3650d}
      kakao-admin-key: ${KAKAO_ADMIN_KEY:}
      connect-timeout: ${OAUTH_UNLINK_CONNECT_TIMEOUT:3s}
      read-timeout: ${OAUTH_UNLINK_READ_TIMEOUT:5s}
    email:
      from: ${BREVO_FROM_EMAIL:}
      code-expiration: ${EMAIL_VERIFICATION_CODE_EXPIRATION:5m}
      resend-cooldown: ${EMAIL_VERIFICATION_RESEND_COOLDOWN:5m}
      verified-expiration: ${EMAIL_VERIFICATION_VERIFIED_EXPIRATION:10m}
      admin-otp-expiration: ${ADMIN_OTP_EXPIRATION:5m}
      admin-otp-resend-interval: ${ADMIN_OTP_RESEND_INTERVAL:60s}
      admin-login-attempt-window: ${ADMIN_LOGIN_ATTEMPT_WINDOW:10m}
      admin-login-max-attempts: ${ADMIN_LOGIN_MAX_ATTEMPTS:5}
    login-attempt:
      window: ${LOGIN_ATTEMPT_WINDOW:10m}
      identifier-max-failures: ${LOGIN_IDENTIFIER_MAX_FAILURES:5}
      ip-max-failures: ${LOGIN_IP_MAX_FAILURES:30}
      trusted-proxies: ${LOGIN_TRUSTED_PROXIES:127.0.0.1,::1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  integrations:
    google-maps:
      api-key: ${GOOGLE_MAPS_API_KEY}
      routes-api-key: ${GOOGLE_ROUTES_API_KEY:${GOOGLE_MAPS_API_KEY:}}
      referer: ${GOOGLE_MAPS_API_REFERER:}
      connect-timeout: ${GOOGLE_MAPS_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_MAPS_READ_TIMEOUT:5s}
      photo-read-timeout: ${GOOGLE_MAPS_PHOTO_READ_TIMEOUT:30s}
      places-requests-per-minute: ${GOOGLE_MAPS_PLACES_REQUESTS_PER_MINUTE:300}
      routes-requests-per-minute: ${GOOGLE_MAPS_ROUTES_REQUESTS_PER_MINUTE:300}
      public-photo-requests-per-minute: ${GOOGLE_MAPS_PUBLIC_PHOTO_REQUESTS_PER_MINUTE:60}
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_API_BASE_URL:https://api.openai.com}
      model: ${OPENAI_MODEL:gpt-5-nano}
      connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
      read-timeout: ${OPENAI_READ_TIMEOUT:30s}
