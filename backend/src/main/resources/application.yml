spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:20MB}

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  file-storage:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
  auth:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:3600000}
      refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:1209600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  integrations:
    google-maps:
      api-key: ${GOOGLE_MAPS_API_KEY}
      referer: ${GOOGLE_MAPS_API_REFERER:}
      connect-timeout: ${GOOGLE_MAPS_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_MAPS_READ_TIMEOUT:5s}
    ai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_API_BASE_URL}
      model: ${AI_MODEL}
    aws:
      access-key-id: ${AWS_ACCESS_KEY_ID}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY}
      region: ${AWS_REGION:ap-northeast-2}
      s3-bucket: ${AWS_S3_BUCKET}
